<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <!--인라인 스타일( 태그 안에 직접 )-->
    <p style="color: red;">빨간 글씨</p>
    <p>빨간 글씨</p>
    <p>빨간 글씨</p>

    <!--내부 스타일-->
    <style>
        /* h5 {color: blue} h5 */
        #h5 {color: blue} /* 아이디 */
        /* .h5 {color: blue} 클래스 */
    </style>
    <h5>내부 스타일 css가 적용된 h5</h5>
    <h5 class="h5">내부 스타일 css가 적용된 h5</h5>
    <h5 style="color: red;">내부 스타일 css가 적용된 h5</h5>
    <h5 id="h5">내부 스타일 css가 적용된 h5</h5>

    <!--외부 스타일-->
    <link rel="stylesheet" href="style.css">
</body>
</html>
